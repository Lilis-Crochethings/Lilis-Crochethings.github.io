<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Half double crochet: a long T — the stem with a bar across its top.
     Solid black on transparent like every other entry in this folder, since
     these are rendered as CSS masks and only the shape carries. Drawn tall
     in a square canvas on purpose: mask-size:contain fits the canvas to the
     symbol's own box, so a tall glyph renders at full height, centred, with
     the spare width to either side. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round">
    <path d="M100 20 V180" />
    <path d="M55 20 H145" />
  </g>
</svg>
