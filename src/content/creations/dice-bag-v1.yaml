description: |-
  My first go at a dice bag for our D&D nights 🎲. It's a drawstring pouch with separate inner pockets, so each set of dice gets its own compartment instead of everything clattering around together — and when you pull the cord shut, the whole thing folds up into a neat little bowl.

  I wanted to make this bag as a birthday present and I bought the gradient yarn especially for this project. However, after my first attempt I wasn't happy with how the gradient showed up... or how it just didn't show up. So I started my [second version](/creations/dice-bag-v2) in hopes it would turn out better.
