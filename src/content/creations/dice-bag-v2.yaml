description: |-
  So after my [first non-gradient attempt](/creations/dice-bag-v1) at the dice bag, it was time to attempt a second version. However, while making my first version, I found a few ways in which I could optimize the pattern and make my life a bit easier.

  Instead of first making the outside of the bag and then attaching the pockets to it, I first made the pockets and made the bag around it. This way I could crochet them together, instead of having to sew the pockets to the outside of the bag (which was really hard with the lemon peel stitch). This simplification is probably also why it took me 2 hours less to make the second version.

  I also like how the gradient decided to show up for the last 3 rounds or something 😅. I made the bag I think 2 or 3 rounds higher and also attached the pockets a bit higher up. Overall I'm really satisfied with this version. I also ended up gifting this version and keeping the first one haha.
