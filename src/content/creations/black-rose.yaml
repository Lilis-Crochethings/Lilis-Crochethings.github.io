description: |-
  I made this rose black since it's my bf's favorite color. Men deserve to receive flowers as well ❤️.

  It sits on a wired stem, so the rose can be bent into whatever pose you like and it never needs water. 🥀

  Black yarn is very hard to photograph though so I had to turn up the brightness to be able to show the flower.
